[package]
name = "tabularium-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "tabularium_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41.1", features = ["backup", "bundled"] }
sha2 = "0.11.1"

[dev-dependencies]
tempfile = "3.27.0"
